<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ESS · Six landing pages | Design study</title>
<style>
:root{--ink:#14243b;--muted:#485c73;--line:#d5dfea;--wash:#eef4fa;--blue:#245b98;--navy:#14243b;--amber:#f2b766;--white:#fff;--radius:14px}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--blue)}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{min-height:44px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #1d65aa;outline-offset:4px}.wrap{width:min(1140px,calc(100% - 44px));margin:auto}.studybar{padding:.35rem 0;background:var(--wash);font-size:.83rem;color:var(--muted);border-bottom:1px solid var(--line)}.header{background:white;border-bottom:1px solid var(--line)}.navbar{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:64px;flex-wrap:wrap}.brand{text-decoration:none;color:var(--ink);font-weight:900;letter-spacing:.045em;font-size:1rem;white-space:nowrap}.brand span{color:var(--blue);display:block;font-size:.72rem;letter-spacing:.14em}.nav{display:flex;gap:.25rem;flex-wrap:wrap}.nav a{padding:.6rem .7rem;text-decoration:none;font-weight:650;color:var(--ink);border:1px solid transparent;border-radius:8px}.nav [aria-current]{background:var(--wash);color:var(--blue);border-color:var(--line)}.statusbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;align-items:center;margin:.8rem 0;padding:.4rem .65rem;border:1px solid var(--line);background:white;border-radius:9px;font-size:.875rem}.statusbar a{text-decoration:none;font-weight:700}.statusbar strong{color:var(--ink)}main{padding-bottom:28px}.hero{display:grid;grid-template-columns:1fr minmax(0,1fr);gap:26px;align-items:stretch;margin:1.35rem 0}.intro{padding:.35rem 0}.kicker{color:var(--blue);font-size:.75rem;font-weight:800;letter-spacing:.13em;margin:0 0 .45rem}.intro h1{font-weight:780;letter-spacing:-.055em;line-height:1.02;font-size:clamp(2.1rem,4.95vw,4.1rem);margin:0 0 .65rem;white-space:pre-line}.intro p.deck{color:var(--muted);margin:.5rem 0 1rem;max-width:48ch}.visual{margin:0;background:var(--navy);color:var(--white);border-radius:var(--radius);overflow:hidden;display:grid;align-content:start;padding:1rem 1.1rem}.visual .kicker{color:#a9c9ed}.visual svg{display:block;width:100%;height:auto;max-height:190px;background:#182e49;border-radius:8px;border:1px solid #3f5977;min-height:90px}.visual figcaption{margin-top:.6rem}.visual h2{font-size:1.22rem;margin:0 0 .2rem;color:#fff}.visual p{font-size:.9rem;color:#d0deee;margin:0}.visual .mark{display:inline-block;color:#f9cf91;font-size:.75rem;margin-top:.5rem}.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}.home-links{grid-template-columns:repeat(2,minmax(0,1fr));margin:.9rem 0 0}.card{background:white;border:1px solid var(--line);padding:.75rem;border-radius:10px;text-decoration:none;display:block;color:var(--ink);min-width:0}.card span{display:block;color:var(--muted);font-size:.88rem}.card:hover{border-color:var(--blue);background:#f6faff}.card strong{color:#214f84}.section-heading{margin:1.1rem 0 .55rem;font-size:1.2rem}.field{display:grid;gap:.28rem;min-width:0;margin:.6rem 0}.field label{font-weight:700;font-size:.9rem}.field :is(input,select){width:100%;min-width:0;padding:.5rem .65rem;border:1px solid #9eb4cb;background:white;color:var(--ink);border-radius:8px}.field p{margin:0}.searchline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem}.searchline input{min-width:0}.searchline button{white-space:nowrap}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:.65rem 0}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.45rem .8rem;border-radius:8px;border:1px solid var(--blue);text-decoration:none;font-weight:700;background:var(--blue);color:white}.btn.alt{background:white;color:var(--blue)}.selection{border:1px solid var(--line);padding:.65rem .75rem;border-radius:8px;background:white}.selection ul{padding-left:1.2rem}.tag{display:inline-block;padding:.15rem .42rem;background:#e7f0fa;color:#234e7c;border-radius:5px;font-size:.78rem}.band{margin-top:1rem;padding:.7rem .85rem;border-radius:8px;border:1px solid var(--line);background:var(--wash);font-size:.9rem}.band p{margin:.25rem 0}.spec{margin:1rem 0;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:1rem}.spec h1{margin:.35rem 0}.spec dl{display:grid;gap:.3rem;grid-template-columns:max-content 1fr}.spec dd{margin:0}.note{color:var(--muted);font-size:.86rem}.live{padding:.35rem 0;color:#214f84;font-size:.87rem}.foot{padding:1rem 0;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:740px){.wrap{width:calc(100% - 28px)}.navbar{justify-content:flex-start;padding-top:.5rem;gap:.25rem;min-height:0}.brand{width:100%}.brand span{display:inline;margin-left:.4rem}.nav{gap:.2rem}.nav a{font-size:.86rem;padding:.42rem .46rem}.statusbar{margin:.6rem 0;padding:.35rem .5rem}.hero{grid-template-columns:1fr;gap:.5rem;margin:.7rem 0 .9rem}.intro{padding:0}.intro h1{font-size:clamp(2.05rem,8vw,3.1rem)}.intro p.deck{margin:.35rem 0 .65rem}.visual{padding:.75rem}.visual svg{max-height:133px}.visual h2{font-size:1.12rem}.cardgrid{grid-template-columns:1fr}.home-links{grid-template-columns:repeat(2,minmax(0,1fr));margin:.55rem 0}.home-links .card{padding:.5rem}.section-heading{margin:.8rem 0 .4rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="studybar"><div class="wrap">Design study · interactive navigation and local sample setup · illustrative graphics</div></div>
<header class="header"><div class="wrap navbar"><a class="brand" href="#home">ENDICOTT <span>SPEED SHOP</span></a><nav class="nav" id="nav" aria-label="Main navigation"></nav></div></header>
<div class="wrap"><div class="statusbar" id="context" aria-label="Active vehicle"></div>
<main id="main" tabindex="-1"></main><footer class="foot">Measure. Test. Improve. <span class="note">Engineering examples in this study are illustrative. Live candidate retains its original tools and calculations.</span></footer></div>
<script>
'use strict';
const pages=[{"id":"home","name":"Home","eyebrow":"ENDICOTT SPEED SHOP","title":"Your car.\nYour experiment.","deck":"Find a car, try one change and see what it affects.","action":"Find a vehicle","next":"explore","panel":"Featured experiment","visual":"Does more grip help you stop sooner?","detail":"Try two tire setups on the same car.","kind":"brake","goal":"Get to a useful experience in one choice.","other":[["Explore","Find a car or compare specifications.","explore"],["Test","Change one thing and see its effect.","test"],["Plan","Turn an objective into a next step.","plan"],["Learn","Understand what moves the numbers.","learn"]]},{"id":"explore","name":"Explore","eyebrow":"VEHICLE RESEARCH","title":"Find the exact car.","deck":"Search by year, make or model. Compare factory facts and published tests.","action":"Search the index","next":"explore","panel":"Featured pairing","visual":"Lightweight or front-drive grip?","detail":"1990 Miata and 2023 Civic Type R","kind":"compare","goal":"Reach a trustworthy answer before offering a test.","other":[["Specifications","Open an exact variant and its sources.","spec"],["Compare specifications","Keep vehicle identity fixed across views.","compare"],["Test this car","Carry a selected reference to Test.","test"]]},{"id":"test","name":"Test","eyebrow":"MODIFY & COMPARE","title":"Change one thing.","deck":"Keep the baseline alongside the setup. Pick a test that answers your question.","action":"Apply a tire change","next":"test","panel":"Baseline vs modification","visual":"Braking distance","detail":"Choose two tire setups to see how the result would be presented.","kind":"brake","goal":"Keep the intervention, result and evidence close.","other":[["Modify","Engine, transmission, traction or custom part.","test"],["Why the result changes","See how a tire spends its grip.","learn"],["Save this setup","Name a variant to revisit or compare.","garage"]]},{"id":"plan","name":"Plan","eyebrow":"BUILD DECISIONS","title":"What are you trying\nto improve?","deck":"Define an objective, record the baseline and identify the next piece of evidence.","action":"Choose an objective","next":"plan","panel":"Next decision","visual":"Measure before selecting parts.","detail":"Objective → baseline → compare options → verify.","kind":"plan","goal":"Create a practical next step with fitment and cost uncertainty visible.","other":[["Measure the baseline","Record current ride, weight or axle information.","learn"],["Try a relevant test","See the difference with your car still selected.","test"],["Compare compatible options","Review evidence and missing fitment inputs.","explore"]]},{"id":"learn","name":"Learn","eyebrow":"ENGINEERING EXPLAINED","title":"Why did the\nresult move?","deck":"Start with a question, see the mechanism and try it on a car.","action":"Open the traction example","next":"learn","panel":"Engineering foundation","visual":"Braking and turning share grip.","detail":"Move the inputs to see how the budget changes.","kind":"traction","goal":"Answer the direct-entry question and make a next experiment useful.","other":[["Traction circle","Explore combined braking and cornering.","learn"],["Spring rate and ride","Find the link between the spring and the wheel.","learn"],["Try it in Test","Return to the experiment with your vehicle.","test"]]},{"id":"garage","name":"My Garage","eyebrow":"SAVED CONFIGURATIONS","title":"Pick up where\nyou left off.","deck":"Choose an active setup or keep a separate variant for comparison.","action":"Save this setup","next":"garage","panel":"Your active setup","visual":"One car. Separate variants.","detail":"Compare a saved change with the original baseline.","kind":"garage","goal":"Make returning and comparing worthwhile without overwriting the baseline.","other":[["Continue modifying","Open the active setup in Test.","test"],["Continue planning","Open the next decision for this vehicle.","plan"],["Find another vehicle","Add a reference without replacing saved setups.","explore"]]}];
const drawings={"brake":"<path d=\"M26 53H454M26 150H454\" stroke=\"#294665\"/><path d=\"M26 102H454\" stroke=\"#587695\" stroke-dasharray=\"10 11\"/><path d=\"M65 71H318M65 121H374\" stroke-linecap=\"round\" stroke-width=\"4\"/><path d=\"M318 59v23M374 109v23\" stroke=\"#f2b766\" stroke-width=\"3\"/><rect x=\"73\" y=\"63\" width=\"38\" height=\"16\" rx=\"7\" fill=\"#9abde6\"/><rect x=\"73\" y=\"113\" width=\"38\" height=\"16\" rx=\"7\" fill=\"#f2b766\"/>","compare":"<path d=\"M44 151h390M44 45h390M44 100h390\" stroke=\"#294665\"/><rect x=\"58\" y=\"49\" width=\"159\" height=\"31\" rx=\"4\" fill=\"#71a7e1\"/><rect x=\"58\" y=\"105\" width=\"259\" height=\"31\" rx=\"4\" fill=\"#f2b766\"/><circle cx=\"400\" cy=\"150\" r=\"16\"/><path d=\"m392 150 6 5 11-12\"/>","plan":"<path d=\"M64 105H416\" stroke=\"#587695\" stroke-width=\"2\"/><circle cx=\"72\" cy=\"105\" r=\"17\" fill=\"#71a7e1\"/><circle cx=\"184\" cy=\"105\" r=\"17\" fill=\"#f2b766\"/><circle cx=\"296\" cy=\"105\" r=\"17\" fill=\"#14243b\"/><circle cx=\"408\" cy=\"105\" r=\"17\" fill=\"#14243b\"/><path d=\"m65 104 5 5 9-10\" stroke=\"#11253b\"/>","traction":"<circle cx=\"240\" cy=\"101\" r=\"67\" stroke=\"#71a7e1\"/><path d=\"M146 101h188M240 14v174\" stroke=\"#587695\" stroke-dasharray=\"4 6\"/><path d=\"m240 101 48-41\" stroke=\"#f2b766\" stroke-width=\"3\"/><circle cx=\"288\" cy=\"60\" r=\"6\" fill=\"#f2b766\"/>","garage":"<path d=\"M112 150h256M130 142l22-40 39-23h96l39 23 23 40\" stroke=\"#71a7e1\" stroke-width=\"3\"/><path d=\"M157 115h166M203 80l-17 35m90-35 17 35\" stroke=\"#587695\"/><circle cx=\"170\" cy=\"145\" r=\"12\" fill=\"#f2b766\"/><circle cx=\"309\" cy=\"145\" r=\"12\" fill=\"#f2b766\"/>"};
const vehicles=[
 {id:'miata',title:'1990 Mazda MX-5 Miata',trim:'1.6 · 5-speed manual',slug:'1990-mazda-mx-5-miata-1-6-base-manual-m5-us/'},
 {id:'civic',title:'2023 Honda Civic Type R',trim:'2.0 turbo · 6-speed manual',slug:'2023-honda-civic-type-r-six-speed-manual-m6-us/'},
 {id:'z06',title:'2006 Chevrolet Corvette Z06',trim:'7.0 LS7 · 6-speed manual',slug:'2006-chevrolet-corvette-z06-7-0-ls7-six-speed-m6-us/'}];
const byId = id => vehicles.find(v=>v.id===id);
const stored = 'ess.design-review.demo.v1';
const defaults = {active:'miata',change:'Stock tires',goal:'',saved:[]};
let state={...defaults};
try{const old=JSON.parse(localStorage.getItem(stored));if(old&&byId(old.active))state={...defaults,...old};}catch{}
let query='';
function routeInfo(){const [name,q]=location.hash.slice(1).split('?');return {name, params:new URLSearchParams(q)};}
const main=document.getElementById('main');
const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const link=(page,label)=>'<a class="btn alt" href="#'+page+'">'+label+'</a>';
const act=(name,label)=>'<button class="btn" type="button" data-action="'+name+'">'+label+'</button>';
const cards=(items,home=false)=>'<div class="cardgrid '+(home?'home-links':'')+'">'+items.map(([label,note,route])=>'<a class="card" href="#'+route+'"><strong>'+label+'</strong><span>'+note+'</span></a>').join('')+'</div>';
function draw(page){return '<figure class="visual"><p class="kicker">'+page.panel+'</p><svg aria-hidden="true" viewBox="0 0 480 206" fill="none" stroke="#9abde6" stroke-width="2">'+drawings[page.kind]+'</svg><figcaption><h2>'+page.visual+'</h2><p>'+page.detail+'</p><span class="mark">Illustrative graphic</span></figcaption></figure>';}
function persist(){try{localStorage.setItem(stored,JSON.stringify(state));}catch{}}
function stateText(){return '<strong>'+byId(state.active).title+'</strong> · '+escape(state.change);}
function showContext(){document.getElementById('context').innerHTML='<span>Active demo setup · '+stateText()+'</span><a href="#garage">Manage setup</a>';}
function picker(){return '<div class="field"><label for="pick">Active vehicle</label><select id="pick">'+vehicles.map(v=>'<option value="'+v.id+'" '+(v.id===state.active?'selected':'')+'>'+v.title+'</option>').join('')+'</select></div>';}
function search(){return '<form id="search" class="field" role="search"><label for="find">Year, make or model</label><div class="searchline"><input id="find" name="q" type="search" value="'+escape(query)+'" placeholder="Try Miata or Civic"><button class="btn" type="submit">Search</button></div></form>';}
function introControls(id){
 if(id==='home')return search()+cards(pages[0].other,true);
 if(id==='explore'){
  const terms=query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows=vehicles.filter(v=>terms.every(t=>(v.title+' '+v.trim).toLowerCase().includes(t)));
  return search()+'<div class="selection"><strong>'+rows.length+' sample '+(rows.length===1?'variant':'variants')+'</strong><ul>'+rows.map(v=>'<li><a href="#spec?car='+v.id+'">'+v.title+'</a> · '+v.trim+'</li>').join('')+'</ul></div>';
 }
 if(id==='test')return picker()+'<div class="field"><label for="change">Try a tire change</label><select id="change">'+['Stock tires','Higher-grip street tire','Track-oriented tire'].map(x=>'<option '+(state.change===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="actions">'+act('apply','Apply demo change')+link('learn','Why it matters')+'</div><p class="live" role="status">Selected setup · '+escape(state.change)+'</p>';
 if(id==='plan')return '<div class="field"><label for="goal">Your objective</label><select id="goal"><option value="">Choose an objective</option>'+['Better street braking','More predictable cornering','Lower cruise RPM'].map(x=>'<option '+(state.goal===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="actions">'+act('goal','Set demo objective')+link('test','Continue to a test')+'</div><p class="live" role="status">'+(state.goal?'Objective · '+escape(state.goal):'Choose a goal to start a local draft.')+'</p>';
 if(id==='learn')return '<details class="selection"><summary>Why traction is a shared budget</summary><p>When a tire brakes and corners at the same time, both forces draw on its available grip. Surface and load affect the real limit.</p></details><div class="actions">'+link('test','Try a tire change')+'</div>';
 return picker()+'<div class="actions">'+act('save','Save demo variant')+link('test','Continue in Test')+'</div><p class="live" role="status">Saved here · '+state.saved.length+'</p>'+state.saved.map((s,i)=>'<div class="selection"><strong>'+escape(s.label)+'</strong><div class="actions"><button type="button" class="btn alt" data-load="'+i+'">Use saved variant</button></div></div>').join('');
}
function current(){const h=routeInfo().name;return [...pages.map(p=>p.id),'spec','compare'].includes(h)?h:'home';}
function render(focus=false){
 const route=current(), page=pages.find(p=>p.id===route)??pages[1], sibling=route==='spec'||route==='compare';
 document.title=page.name+' · ESS design study';
 document.getElementById('nav').innerHTML=pages.slice(1).map(x=>'<a href="#'+x.id+'" '+(x.id===page.id?'aria-current="page"':'')+'>'+x.name+'</a>').join('');
 showContext();
 if(sibling){
  const record=byId(routeInfo().params.get('car'))||byId(state.active);
  const rows=route==='compare'?vehicles.slice(0,2):[record];
  main.innerHTML='<section class="spec"><p class="kicker">EXPLORE · SAMPLE '+(route==='compare'?'COMPARISON':'REFERENCE LANDING')+'</p><h1>'+(route==='compare'?'Compare specifications':record.title)+'</h1><dl>'+rows.map(v=>'<dt>'+v.title+'</dt><dd>'+v.trim+'</dd>').join('')+'</dl><p class="note">The integrated vehicle pages carry detailed specifications, provenance and canonical IDs.</p><div class="actions">'+act('test-spec','Test this sample vehicle')+link('explore','Back to vehicle search')+'</div></section>';
 }else{
  const incoming=routeInfo().params;
  const origin=incoming.get('from');
  const source=origin==='spec'||origin==='compare'?origin:'';
  const suffix=source==='spec'?'?car='+encodeURIComponent(incoming.get('car')||state.active):'';
  const handoff=route==='test'&&source?'<div class="band"><a href="#'+source+suffix+'">← Return to '+(source==='compare'?'comparison':'specifications')+'</a><p>Your selected car stays active while this experiment is open.</p></div>':'';
  main.innerHTML=handoff+'<section class="hero"><div class="intro"><p class="kicker">'+page.eyebrow+'</p><h1>'+page.title+'</h1><p class="deck">'+page.deck+'</p>'+introControls(route)+'</div>'+draw(page)+'</section>'+(route==='home'?'<div class="actions">'+link('test','Try the featured experiment')+'</div>':'<h2 class="section-heading">Continue with this car</h2>'+cards(page.other))+'<div class="band"><p>'+page.goal+'</p><p class="note">Running here: navigation, sample search, explicit setup changes and local saves. Results and visual comparisons are design examples.</p></div>';
 }
 if(focus)main.focus();
}
document.addEventListener('submit',e=>{if(e.target.id!=='search')return;e.preventDefault();query=new FormData(e.target).get('q')||'';if(current()==='explore')render(true);else location.hash='explore';});
document.addEventListener('change',e=>{if(e.target.id==='pick'&&byId(e.target.value)){state.active=e.target.value;state.change='Stock tires';persist();render();document.getElementById('pick')?.focus();}});
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-action],[data-load]');if(!node)return;
 if(node.dataset.load!==undefined){const variant=state.saved[Number(node.dataset.load)];if(variant&&byId(variant.active)){state.active=variant.active;state.change=variant.change;persist();render(true);}return;}
 const action=node.dataset.action;
 if(action==='test-spec'){
  const id=routeInfo().params.get('car');
  const next=byId(id)?.id||state.active;
  if(next!==state.active){state.active=next;state.change='Stock tires';}
  persist();location.hash='test?from='+current()+'&car='+encodeURIComponent(next);return;
 }
 if(action==='apply'){state.change=document.getElementById('change').value;}
 if(action==='goal'){state.goal=document.getElementById('goal').value;}
 if(action==='save'){state.saved=[...state.saved,{label:byId(state.active).title+' · '+state.change,active:state.active,change:state.change}];}
 persist();render();document.querySelector('[data-action="'+action+'"]')?.focus();
});
addEventListener('hashchange',()=>render(true));render();
</script></body></html>
